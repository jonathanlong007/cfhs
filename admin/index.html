<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | Canal Fulton Heritage Society</title>
    <!-- Include the script that builds the page framework automatically -->
    <script src="https://unpkg.com@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>


    <script>
  // Force the login script engine to link directly to your Netlify application service instance
  document.addEventListener("DOMContentLoaded", () => {
    if (window.netlifyIdentity) {
      // ⚠️ CHANGE THIS to your exact Netlify site URL from your Netlify Dashboard
      window.netlifyIdentity.init({
        APIUrl: "https://fascinating-moonbeam-cb13ec.netlify.app/"
      });
      
      // Auto-trigger the popup window immediately if no active user session is found
      if (!window.netlifyIdentity.currentUser()) {
        window.netlifyIdentity.open("login");
      }
    }
  });
</script>

  </body>
</html>
