<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Heritage Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Top Navigation Bar Referenced Everywhere -->
    <nav class="top-navbar" id="main-nav"></nav>

    <!-- Main Dynamic Container Split Screen -->
    <main class="split-container">
        
        <!-- Left Side: Major Topics -->
        <section class="left-topics" id="topics-sidebar"></section>

        <!-- Right Side: Interactive Photo Carousel -->
        <section class="right-carousel">
            <div class="carousel-wrapper" id="carousel-container">
                <!-- Dynamic Images Go Here -->
            </div>
            <!-- Navigation controls -->
            <button class="carousel-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
            <button class="carousel-btn next-btn" onclick="moveSlide(1)">&#10095;</button>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
