content:
  - name: heritage_house
    label: Heritage House
    type: file
    path: _data/museums/heritage-house.yml
    fields:
      - name: title
        label: Museum Name
        type: string
      - name: description
        label: Description
        type: text
  - name: events
    label: Historical Events
    type: file
    path: data/events.json
    format: json
    list: true
    fields:
      - name: title
        label: Event Title
        type: string
      - name: date
        label: Event Date
        type: date
      - name: description
        label: Description
        type: text

