content:
  - name: heritage_house
    label: Heritage House
    type: file
    path: _data/museums/heritage-house.yml
    fields:
      - name: title
        label: Museum Name
        type: string
      - name: description
        label: Description
        type: text
  - name: events
    label: Historical Events
    type: file
    path: _data/events.json
    format: json
    list: true
    fields:
      - name: Events
        label: Community Events
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {date}"
    fields:
      - name: title
        label: Event Title
        type: string
      - name: date
        label: Event Date
        type: date
      - name: time
        label: Event Time
        type: string
      - name: location
        label: Event Location
        type: string
      - name: description
        label: Description
        type: text

