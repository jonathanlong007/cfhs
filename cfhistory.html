<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Tale of Three Cities | Canal Fulton History</title>
  <style>
    /* --- Modernized CSS Variables & Color Tokens --- */
    :root {
      --primary-crimson: #9a1c1c;
      --primary-crimson-hover: #7a1414;
      --bg-cream: #fdfbf7;
      --bg-white: #ffffff;
      --text-charcoal: #2d2d2d;
      --text-muted: #666666;
      --border-color: #e8e2d9;
      --accent-gold: #c5a059;
      --max-text-width: 65ch;
      --font-serif: "Georgia", "Times New Roman", serif;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    /* --- Base Resets & Typography --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-charcoal);
      font-family: var(--font-sans);
      line-height: 1.65;
      font-size: 1.125rem;
      -webkit-font-smoothing: antialiased;
    }

    /* --- Header & Layout Containers --- */
    header {
      background-color: var(--bg-white);
      border-bottom: 2px solid var(--primary-crimson);
      padding: 1.5rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-group img {
      height: 50px;
      width: auto;
    }

    .logo-text h1 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      color: var(--primary-crimson);
      font-weight: 700;
    }

    .logo-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      background-color: var(--primary-crimson);
      color: var(--bg-white);
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }

    .back-btn:hover {
      background-color: var(--primary-crimson-hover);
    }

    main {
      max-width: 1100px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    /* --- Title Hero Section --- */
    .hero-section {
      text-align: center;
      margin-bottom: 3.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 2rem;
    }

    .hero-section h2 {
      font-family: var(--font-serif);
      font-size: 2.75rem;
      color: var(--text-charcoal);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .hero-section p {
      font-style: italic;
      color: var(--text-muted);
      font-size: 1.25rem;
    }

    /* --- Interactive Chronological Accordions --- */
    .era-accordion {
      background-color: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .era-accordion:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    .era-accordion summary {
      list-style: none;
      padding: 1.5rem;
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-crimson);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      outline: none;
      background-color: var(--bg-white);
    }

    .era-accordion summary::-webkit-details-marker {
      display: none;
    }

    .era-accordion summary::after {
      content: "+";
      font-family: var(--font-sans);
      font-size: 1.75rem;
      line-height: 1;
      color: var(--accent-gold);
      transition: transform 0.3s ease;
    }

    .era-accordion[open] summary {
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(253, 251, 247, 0.5);
    }

    .era-accordion[open] summary::after {
      content: "−";
    }

    .era-content {
      padding: 2rem;
    }

    /* --- Split-Grid Content Scanning & Multi-Era Layouts --- */
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2.5rem;
      align-items: start;
    }

    .narrative-text {
      max-width: var(--max-text-width);
    }

    .narrative-text p {
      margin-bottom: 1.5rem;
      text-align: justify;
    }

    .narrative-text p:last-child {
      margin-bottom: 0;
    }

    /* --- High-Quality Media Panels & Sticky Sidebars --- */
    .media-sidebar {
      position: sticky;
      top: 120px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .archive-card {
      background-color: var(--bg-cream);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }

    .archive-card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      filter: sepia(10%) contrast(102%);
      margin-bottom: 0.75rem;
    }

    .archive-card figcaption {
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--text-muted);
      border-left: 2px solid var(--accent-gold);
      padding-left: 0.5rem;
    }

    /* --- Scholarly Citation Design & Footnote System --- */
    .citation-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(154, 28, 28, 0.08);
      color: var(--primary-crimson);
      font-size: 0.75rem;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      text-decoration: none;
      margin-left: 0.2rem;
      vertical-align: super;
      transition: all 0.2s ease;
    }

    .citation-badge:hover {
      background-color: var(--primary-crimson);
      color: var(--bg-white);
    }

    .footnote-marker {
      display: inline-block;
      color: var(--accent-gold);
      font-weight: 700;
      margin-left: 0.2rem;
      vertical-align: super;
      cursor: help;
    }

    /* --- Footnotes & Web Page Notes Panel --- */
    .notes-section {
      margin-top: 5rem;
      background-color: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 2.5rem;
    }

    .notes-section h3 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      color: var(--primary-crimson);
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .notes-list {
      list-style: none;
    }

    .notes-list li {
      font-size: 0.95rem;
      color: var(--text-charcoal);
      margin-bottom: 1.25rem;
      padding-left: 2rem;
      text-indent: -2rem;
      line-height: 1.5;
    }

    .notes-list li strong {
      color: var(--primary-crimson);
    }

    /* --- Footer Context Section --- */
    footer {
      background-color: var(--text-charcoal);
      color: #e8e2d9;
      padding: 3rem 2rem;
      margin-top: 6rem;
      font-size: 0.95rem;
    }

    .footer-container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
    }

    .footer-about h4 {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      color: var(--bg-white);
      margin-bottom: 1rem;
    }

    .footer-contact h4 {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      color: var(--bg-white);
      margin-bottom: 1rem;
    }

    .footer-contact p {
      margin-bottom: 0.5rem;
    }

    .footer-contact a {
      color: var(--accent-gold);
      text-decoration: none;
    }

    .footer-contact a:hover {
      text-decoration: underline;
    }

    /* --- Responsive Architecture Layout (Mobile Optimization) --- */
    @media (max-width: 900px) {
      .split-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      
      .media-sidebar {
        position: static;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .hero-section h2 {
        font-size: 2.25rem;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 1rem;
      }
      
      .header-container {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      .era-content {
        padding: 1.25rem;
      }

      .era-accordion summary {
        font-size: 1.25rem;
        padding: 1.25rem;
      }

      .footer-container {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Modern Header Framework -->
  <header>
    <div class="header-container">
      <div class="logo-group">
        <img src="https://cfheritage.org" alt="CFHS Seal">
        <div class="logo-text">
          <h1>Canal Fulton Heritage Society</h1>
          <p>Preserving Our Shared History</p>
        </div>
      </div>
      <a href="/" class="back-btn">← Back to Main</a>
    </div>
  </header>

  <!-- Main Narrative Workspace -->
  <main>
    <div class="hero-section">
      <h2>A Tale of Three Cities</h2>
      <p>(Well, "Villages" anyway)</p>
    </div>

    <!-- ERA 1: Early Canal Fulton -->
    <details class="era-accordion" open>
      <summary>1. Early Canal Fulton</summary>
      <div class="era-content">
        <div class="split-grid">
          <div class="narrative-text">
          </div>
        </div>
      </div>
    </details>
  </main>
</body>
</html>
